[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# Transitive major-version splits are reviewed by cargo-deny output; denying every
# duplicate makes routine ecosystem transitions impossible without improving safety.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary official SQLx pin until the merged SQLite security bound ships in a
# crates.io patch release. Cargo.lock binds the exact reviewed revision.
allow-git = ["https://github.com/transact-rs/sqlx"]
