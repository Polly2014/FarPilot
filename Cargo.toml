[workspace]
resolver = "2"
members = [
  "crates/farpilot-core",
  "crates/farpilot-gateway",
  "crates/farpilot-host",
  "crates/farpilot-host-runner",
  "crates/farpilot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
libc = "0.2"
portable-pty = "0.9"
qrcode = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.9.0", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
zeroize = { version = "1", features = ["derive"] }
