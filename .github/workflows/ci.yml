name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ssh-security:
    name: OpenSSH restriction integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Verify forced command and forwarding restrictions
        run: sudo --preserve-env=PATH bash tests/security/sshd_integration.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --all-targets
      - name: Build Windows Stage 0 binary
        if: runner.os == 'Windows'
        run: cargo build --release -p farpilot-cli
      - name: Upload Windows Stage 0 binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: farpilot-windows-x86_64-${{ github.sha }}
          path: target/release/farpilot.exe
          if-no-files-found: error
          retention-days: 7
      - name: Build Linux Stage 0 binary
        if: runner.os == 'Linux'
        run: cargo build --release -p farpilot-cli
      - name: Upload Linux Stage 0 binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: farpilot-linux-x86_64-${{ github.sha }}
          path: target/release/farpilot
          if-no-files-found: error
          retention-days: 7
