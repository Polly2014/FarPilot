name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Verify dependency policy
        run: bash tests/security/dependency_policy.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run documentation tests
        run: cargo test --doc --workspace
      - name: Test release tooling
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Verify release workflow structure
        run: |
          bash tests/release/workflow_assets.sh
          bash tests/release/signpath_application_workflow.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell installers
        run: |
          shellcheck install.sh deploy/gateway/install.sh \
            tests/install/install_sh.sh tests/install/gateway_installer.sh \
            tests/security/dependency_policy.sh \
            tests/release/workflow_assets.sh tests/release/signpath_application_workflow.sh

  ssh-security:
    name: OpenSSH restriction integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Build FarPilot as runner user
        run: cargo build -p farpilot-cli
      - name: Verify forced command and forwarding restrictions
        env:
          FARPILOT_TEST_BINARY: ${{ github.workspace }}/target/debug/farpilot
        run: sudo --preserve-env=PATH,FARPILOT_TEST_BINARY bash tests/security/sshd_integration.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --all-targets
      - name: Test POSIX installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/install/install_sh.sh
      - name: Test Gateway installer
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/install/gateway_installer.sh
      - name: Build Windows Stage 0 binary
        if: runner.os == 'Windows'
        run: cargo build --release -p farpilot-cli
      - name: Install PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: Lint Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $findings = @(
            Invoke-ScriptAnalyzer -Path deploy/windows/install.ps1 -ExcludeRule PSUseApprovedVerbs
            Invoke-ScriptAnalyzer -Path deploy/windows/test-install.ps1 -ExcludeRule PSUseApprovedVerbs
          )
          if ($findings.Count -ne 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($findings.Count) issue(s)"
          }
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FARPILOT_TEST_BINARY = (Resolve-Path target/release/farpilot.exe)
          ./deploy/windows/test-install.ps1
      - name: Upload Windows Stage 0 binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: farpilot-windows-x86_64-${{ github.sha }}
          path: target/release/farpilot.exe
          if-no-files-found: error
          retention-days: 7
      - name: Install Linux static-build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build static Linux Stage 0 binary
        if: runner.os == 'Linux'
        run: cargo build --release -p farpilot-cli --target x86_64-unknown-linux-musl
      - name: Upload Linux Stage 0 binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: farpilot-linux-x86_64-musl-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/farpilot
          if-no-files-found: error
          retention-days: 7
