name: SignPath Application Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  APPLICATION_VERSION: "0.1.0"
  APPLICATION_TAG: v0.1.0-unsigned.1
  APPLICATION_ASSET: farpilot-windows-x86_64-unsigned.exe

jobs:
  quality:
    name: SignPath application quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Verify dependency policy
        run: bash tests/security/dependency_policy.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-targets
      - name: Run documentation tests
        run: cargo test --doc --workspace
      - name: Test release tooling
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Verify release workflows
        run: |
          bash tests/release/workflow_assets.sh
          bash tests/release/signpath_application_workflow.sh
      - name: Test installers and deployment policy
        run: |
          bash tests/install/install_sh.sh
          bash tests/install/gateway_installer.sh
          bash tests/workspace_layout.sh
          bash tests/security/deployment_assets.sh
          bash tests/security/sshd_restrictions.sh
          bash tests/e2e/gateway-host.sh
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Build FarPilot for OpenSSH integration
        run: cargo build -p farpilot-cli
      - name: Verify forced command and forwarding restrictions
        env:
          FARPILOT_TEST_BINARY: ${{ github.workspace }}/target/debug/farpilot
        run: sudo --preserve-env=PATH,FARPILOT_TEST_BINARY bash tests/security/sshd_integration.sh
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell code
        run: |
          shellcheck install.sh deploy/gateway/install.sh \
            tests/install/install_sh.sh tests/install/gateway_installer.sh \
            tests/security/dependency_policy.sh \
            tests/release/workflow_assets.sh tests/release/signpath_application_workflow.sh

  windows:
    name: Build unsigned Windows application artifact
    needs: quality
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Windows workspace tests
        run: cargo test --workspace --all-targets
      - name: Build Windows release binary
        run: cargo build --release -p farpilot-cli
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: Lint Windows installer
        shell: pwsh
        run: |
          $findings = @(
            Invoke-ScriptAnalyzer -Path deploy/windows/install.ps1 -ExcludeRule PSUseApprovedVerbs
            Invoke-ScriptAnalyzer -Path deploy/windows/test-install.ps1 -ExcludeRule PSUseApprovedVerbs
          )
          if ($findings.Count -ne 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($findings.Count) issue(s)"
          }
      - name: Test Windows installer
        shell: pwsh
        run: |
          $env:FARPILOT_TEST_BINARY = (Resolve-Path target/release/farpilot.exe)
          ./deploy/windows/test-install.ps1
      - name: Stage unsigned application artifact
        shell: pwsh
        run: |
          $reported = (& target/release/farpilot.exe --version | Select-Object -Last 1).Trim()
          if ($reported -ne "farpilot 0.1.0") {
            throw "unexpected FarPilot version: $reported"
          }
          New-Item -ItemType Directory -Force -Path application | Out-Null
          Copy-Item target/release/farpilot.exe application/farpilot-windows-x86_64-unsigned.exe
          $metadata = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            source_sha = $env:GITHUB_SHA
            workflow_run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            cargo_version = $env:APPLICATION_VERSION
            rustc_version = (& rustc --version).Trim()
            runner_image = $env:ImageOS
            artifact_filename = $env:APPLICATION_ASSET
          }
          $metadata | ConvertTo-Json | Set-Content application/build-input.json -Encoding UTF8
      - uses: actions/upload-artifact@v7
        with:
          name: signpath-application-input
          path: application/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish unsigned SignPath application prerelease
    needs: [quality, windows]
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && github.repository == 'Polly2014/FarPilot'
    runs-on: ubuntu-24.04
    environment:
      name: signpath-application
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: signpath-application-input
          path: application
      - name: Verify source is current main
        run: |
          git fetch origin main --no-tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Assemble exact application artifact set
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path("application")
          binary = directory / os.environ["APPLICATION_ASSET"]
          build_input = directory / "build-input.json"
          if {path.name for path in directory.iterdir() if path.is_file()} != {binary.name, build_input.name}:
              raise SystemExit("unexpected application input artifact set")
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          source = json.loads(build_input.read_text(encoding="utf-8-sig"))
          expected_input_keys = {
              "schema_version", "repository", "source_sha", "workflow_run_url",
              "cargo_version", "rustc_version", "runner_image", "artifact_filename",
          }
          if set(source) != expected_input_keys or source["schema_version"] != 1:
              raise SystemExit("invalid build input metadata")
          if source["repository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("repository mismatch")
          if source["source_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("source SHA mismatch")
          if source["cargo_version"] != os.environ["APPLICATION_VERSION"]:
              raise SystemExit("version mismatch")
          if source["artifact_filename"] != binary.name:
              raise SystemExit("artifact filename mismatch")
          metadata = {
              **source,
              "sha256": digest,
              "unsigned": True,
              "purpose": "signpath-application",
          }
          (directory / "SHA256SUMS").write_text(f"{digest}  {binary.name}\n", encoding="utf-8")
          (directory / "build-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          build_input.unlink()
          expected = {binary.name, "SHA256SUMS", "build-metadata.json"}
          actual = {path.name for path in directory.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected application release set: {sorted(actual)}")
          PY
      - name: Fail closed if tag or release lookup is not absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$APPLICATION_TAG" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "tag already exists: $APPLICATION_TAG" >&2
              exit 1
              ;;
            2)
              ;;
            *)
              echo "unexpected git ls-remote status: $tag_status" >&2
              exit 1
              ;;
          esac

          assert_release_absent() {
            set +e
            release_response=$(gh api --include "/repos/$GITHUB_REPOSITORY/releases/tags/$APPLICATION_TAG" 2>/dev/null)
            release_api_status=$?
            set -e
            release_http_status=$(printf '%s\n' "$release_response" | awk 'toupper($1) ~ /^HTTP/ { status=$2 } END { print status }')
            case "$release_http_status" in
              200)
                echo "release already exists: $APPLICATION_TAG" >&2
                exit 1
                ;;
              404)
                return 0
                ;;
              *)
                echo "unexpected GitHub release lookup status: ${release_http_status:-none} (gh rc $release_api_status)" >&2
                exit 1
                ;;
            esac
          }
          assert_release_absent
      - name: Write unsigned prerelease warning
        run: |
          cat > application-release-notes.md <<'NOTES'
          UNSIGNED SIGNPATH APPLICATION ARTIFACT
          For code-signing review only.
          Do not install on production systems.

          This prerelease contains an unsigned Windows executable submitted only to demonstrate FarPilot's verifiable build form during the SignPath Foundation application process. It is not selected by the stable installer or latest release channel.
          NOTES
      - name: Atomically reserve tag and publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assert_release_absent() {
            set +e
            release_response=$(gh api --include "/repos/$GITHUB_REPOSITORY/releases/tags/$APPLICATION_TAG" 2>/dev/null)
            release_api_status=$?
            set -e
            release_http_status=$(printf '%s\n' "$release_response" | awk 'toupper($1) ~ /^HTTP/ { status=$2 } END { print status }')
            case "$release_http_status" in
              200)
                echo "release already exists: $APPLICATION_TAG" >&2
                exit 1
                ;;
              404)
                return 0
                ;;
              *)
                echo "unexpected GitHub release lookup status: ${release_http_status:-none} (gh rc $release_api_status)" >&2
                exit 1
                ;;
            esac
          }
          assert_release_absent

          if ! gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$APPLICATION_TAG" \
            -f sha="$GITHUB_SHA" >/dev/null; then
            echo "failed to create immutable application tag: $APPLICATION_TAG" >&2
            exit 1
          fi
          remote_tag_sha=$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$APPLICATION_TAG" --jq '.object.sha')
          if [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "created tag does not match dispatched commit" >&2
            exit 1
          fi

          if ! gh release create "$APPLICATION_TAG" \
            application/farpilot-windows-x86_64-unsigned.exe \
            application/SHA256SUMS \
            application/build-metadata.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "FarPilot $APPLICATION_TAG" \
            --notes-file application-release-notes.md; then
            echo "release creation failed; tag $APPLICATION_TAG remains bound to $GITHUB_SHA for reviewed recovery" >&2
            exit 1
          fi
